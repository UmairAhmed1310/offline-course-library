<body>
<header>
  <h1>Offline Course Library <span class="mut">prototype</span></h1>
  <div class="row" id="bar"></div>

<main id="app" aria-live="polite"></main>
<footer class="mut">All data stays on this device. This prototype reads course files in the legacy and Schema v1 formats and is not encrypted. <span id="st"></span></footer>
<script>
/*CORE*/
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
const inl=s=>esc(s).replace(/\\([\[\]])/g,'$1').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>');
function md(t){
  const L=t.split('\n'),o=[];let i=0;
  const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;o.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue}
    let m=l.match(/^(#{1,4})\s+(.*)/);
    if(m){o.push(`<h${m[1].length+2}>${inl(m[2])}</h${m[1].length+2}>`);i++;continue}
    if(/^\s*\|/.test(l)){const r=[];while(i<L.length&&/^\s*\|/.test(L[i]))r.push(L[i++]);
      const rows=r.filter(x=>!/^\s*\|?\s*:?-{3,}/.test(x)).map(cells);
      o.push('<table>'+rows.map((c,k)=>'<tr>'+c.map(x=>k?`<td>${inl(x)}</td>`:`<th>${inl(x)}</th>`).join('')+'</tr>').join('')+'</table>');continue}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ord=/^\s*\d/.test(l),r=[];
      while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i]))r.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/,''));
      o.push((ord?'<ol>':'<ul>')+r.map(x=>`<li>${inl(x)}</li>`).join('')+(ord?'</ol>':'</ul>'));continue}
    if(!l.trim()||/^-{3,}$/.test(l.trim())){i++;continue}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|```|\s*\||\s*([-*]|\d+\.)\s)/.test(L[i]))p.push(L[i++]);
    o.push('<p>'+inl(p.join(' '))+'</p>');
  }
  return o.join('');
}
function splitOptions(b,mn=4){
  const m=[...b.matchAll(/(?:^|\s)([A-E])\.\s/g)].map(x=>({p:x.index+x[0].indexOf(x[1]),l:x[1]}));
  let best=null;
  m.forEach((a,i)=>{if(a.l!=='A')return;const r=[a];let n=66;for(const c of m.slice(i+1))if(c.l.charCodeAt(0)===n){r.push(c);n++}if(r.length>=mn)best=r});
  if(!best)return{stem:b,opts:{}};
  const opts={};best.forEach((c,j)=>{const e=j+1<best.length?best[j+1].p:b.length;opts[c.l]=b.slice(c.p+3,e).replace(/\s*·\s*$/,'').trim()});
  return{stem:b.slice(0,best[0].p).trim(),opts};
}
function parseCourse(t){
  const rep={errors:[],warns:[],info:[]};
  if(t.length>5e6){rep.errors.push('File is larger than 5 MB.');return{rep}}
  const L=t.split('\n'),title=(L.find(l=>/^# /.test(l))||'').slice(2).trim();
  if(!title)rep.errors.push('No course title (a line starting with “# ”) was found.');
  let cur={title:'About this course',md:[]},mode='',secs=[cur];const lab=[],key=[];
  for(const ln of L){
    const h=ln.match(/^## (.*)$/);
    if(h){const n=h[1].trim();mode=/^Practice Lab/.test(n)?'lab':/^Answer Key/.test(n)?'key':/^Library Data/.test(n)?'skip':'';
      cur=mode?null:{title:n,md:[]};if(cur)secs.push(cur);continue}
    if(mode==='lab')lab.push(ln);else if(mode==='key')key.push(ln);else if(cur)cur.md.push(ln);
  }
  secs.forEach((s,i)=>{const m=s.title.match(/^Module (\d+)/);s.id=m?'m'+m[1]:'p'+i;s.kind=m?'module':'page';s.md=s.md.join('\n').trim();s.dom=((s.md.match(/link:[ *]*([A-Z][0-9]+)/))||[])[1]||''});
  secs=secs.filter(s=>s.md);
  if(!secs.some(s=>s.kind==='module'))rep.errors.push('No “Module N” sections were found.');
  const Q=[],K={};
  for(const l of lab){const m=l.match(/^\*\*Q(\d+)\.\*\*\s*(.*)$/);if(!m)continue;
    const body=m[2],tg=body.match(/\((numeric|short answer|rubric|code)\)/i);
    const type=tg?tg[1].toLowerCase().replace(' ','-'):/select two/i.test(body)?'select-two':'mcq';
    const so=(type==='mcq'||type==='select-two')?splitOptions(body):{stem:body,opts:{}};
    Q.push({n:+m[1],type,stem:so.stem,opts:so.opts})}
  for(const l of key){const m=l.match(/^\|\s*(\d+)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*(.*?)\s*\|\s*$/);if(m)K[+m[1]]={ans:m[2],dom:m[3],why:m[4]}}
  Q.forEach(q=>{const k=K[q.n];q.scored=false;q.dom=k?k.dom:'';q.why=k?k.why:'';q.ans=k?k.ans:'';
    if(!k){rep.warns.push(`Q${q.n}: no answer-key row, so it is not scored.`);return}
    if(q.type==='mcq'||q.type==='select-two'){const ls=k.ans.split(/[,\s]+/).filter(Boolean),want=q.type==='mcq'?1:2;
      if(Object.keys(q.opts).length<4)rep.warns.push(`Q${q.n}: options could not be read, so it is not scored.`);
      else if(ls.length!==want||ls.some(x=>!q.opts[x]))rep.warns.push(`Q${q.n}: the key does not match the options, so it is not scored.`);
      else{q.key=ls;q.scored=true}}
    else if(q.type==='numeric'){const m=k.ans.replace(/,/g,'').match(/^\s*(-?[\d.]+)\s*(?:±\s*([\d.]+))?\s*(.*)$/);
      if(m&&!isNaN(+m[1])){q.val=+m[1];q.tol=m[2]?+m[2]:0;q.unit=m[3];q.scored=true;if(!m[2])rep.warns.push(`Q${q.n}: numeric key has no tolerance, so only an exact match counts.`)}
      else rep.warns.push(`Q${q.n}: numeric key could not be read, so it is not scored.`)}
  });
  Object.keys(K).forEach(n=>{if(!Q.some(q=>q.n==n))rep.warns.push(`Key row ${n} has no matching question.`)});
  if(!Q.length)rep.warns.push('No practice questions were found.');
  rep.info.push(/^## Library Data/m.test(t)?applyLib(t,secs,Q):'Legacy format: IDs are derived by the app from module numbers.');
  const hm=t.match(/\(about ([\d.]+) hours\)/i);
  if(!hm)rep.warns.push('No “about N hours” estimate found.');
  
  const mods=secs.filter(s=>s.kind==='module').length,sc=Q.filter(q=>q.scored).length;
  rep.info.push(`${mods} modules, ${Q.length} questions (${sc} scored by rules, ${Q.length-sc} self-check or unreadable), ${hm?hm[1]:'unknown'} estimated hours.`);
  const dg=parseDiag(t);rep.info.push(dg?'Diagnostic: '+dg.items.length+' items read'+(dg.bad?', '+dg.bad+' without a key':'')+'.':'No diagnostic section was found.');return{rep,course:{id:slug(title),title,hours:hm?+hm[1]:null,secs,qs:Q,diag:dg}};
}
function grade(q,r){
  if(q.type==='numeric'){const v=parseFloat(String(r||'').replace(/,/g,''));return isNaN(v)?null:Math.abs(v-q.val)<=q.tol+1e-9}
  const a=[].concat(r||[]);if(!a.length)return null;
  return a.slice().sort().join()===q.key.slice().sort().join();
}
const DIFF=[{n:'Starter',i:'🌱',hi:.15},{n:'Builder',i:'🧭',hi:.4},{n:'Expert',i:'🏆',hi:.7}];
const hi=q=>/^(analy|evalu|creat|valu|organi|character|adapt|origin|complex)/.test(q.bloom||'');
const stars=p=>p>=100?3:p>=90?2:p>=80?1:0;
const shuf=a=>{a=a.slice();for(let i=a.length;i>1;i--){const j=Math.floor(Math.random()*i);[a[i-1],a[j]]=[a[j],a[i-1]]}return a};
function pick(pool,n,seen,lv){
  const k=q=>q.uid||q.n,fr=a=>shuf(a.filter(q=>!seen.includes(k(q)))).concat(shuf(a.filter(q=>seen.includes(k(q)))));
  if(lv==null||!pool.some(q=>q.bloom))return shuf(fr(pool).slice(0,n));
  const H=fr(pool.filter(hi)),L=fr(pool.filter(q=>!hi(q))),h=Math.min(H.length,Math.round(n*lv));
  let o=H.slice(0,h).concat(L.slice(0,n-h));if(o.length<n)o=o.concat(H.slice(h,h+n-o.length));return shuf(o)}
function diffOf(qs){const t=qs.filter(q=>q.bloom);if(!t.length)return null;const s=Math.round(100*t.filter(hi).length/t.length);return{...DIFF[s<28?0:s<55?1:2],share:s}}
function applyLib(t,secs,Q){
  const i=t.search(/^## Library Data/m),rows=t.slice(i).split('\n').filter(l=>l.trim().startsWith('|')).map(l=>l.trim().replace(/^[|]|[|]$/g,'').split('|').map(x=>x.trim()));
  let h=null,n=0;const md={};
  rows.forEach(r=>{if(r[0]==='ID'&&r[1]==='Kind'){h=r.map(x=>x.toLowerCase());return}
    if(!h||/^-+$/.test(r[0]))return;const o={};h.forEach((k,j)=>o[k]=r[j]||'');
    if(o.kind==='module'){const m=o.label.match(/[0-9]+/);if(m){md[o.id]='m'+m[0];const s=secs.find(x=>x.id==='m'+m[0]);if(s)s.uid=o.id}}
    if(o.kind==='question'){const q=Q.find(x=>'Q'+x.n===o.label);if(q){q.uid=o.id;q.bloom=(o.bloom||'').toLowerCase();q.mod=md[o.parent]||'';n++}}});
  return`Library Data (Schema v1) read: ${n} questions matched${Q.some(q=>q.bloom)?', with Bloom tags':', no Bloom tags yet'}.`}
const NL='\n';
const cells=l=>l.trim().replace(/^[|]|[|]$/g,'').split('|').map(x=>x.trim());
function parseCats(t){const m=new Map(),w=[];let h=0;
  for(const l of t.split(NL)){if(!l.trim().startsWith('|'))continue;const c=cells(l);
    if(c[0].toLowerCase()==='id'&&(c[1]||'').toLowerCase()==='name'){h=1;continue}
    if(!h||!c[0]||/^:?-+:?$/.test(c[0]))continue;if(m.has(c[0]))w.push('Duplicate category ID '+c[0]+'; the last one is used.');m.set(c[0],{id:c[0],name:c[1]||c[0],parent:c[2]||'',desc:c[3]||''})}
  return{cats:[...m.values()],warns:w}}
function parseRoads(t){const out=[],w=[];let r=null,lv=null;
  for(const l of t.split(NL)){let m;
    if(m=l.match(/^# Roadmap: *(.*)/)){r={title:m[1].trim(),meta:{},levels:[]};out.push(r);lv=null}
    else if(!r)continue;
    else if(m=l.match(/^## (.*)/)){lv=/^Sources/i.test(m[1].trim())?null:{name:m[1].trim(),steps:[]};if(lv)r.levels.push(lv)}
    else if(l.trim().startsWith('|')){const c=cells(l);if(/^:?-+:?$/.test(c[0])||c[0]==='Field'||c[0]==='Step')continue;
      if(lv){if(/^[0-9]+$/.test(c[0]))lv.steps.push({course:(c[1]||'').toLowerCase(),req:/^(y|yes|true|required)/i.test(c[2]||''),covers:c[3]||'all',note:c[4]||''});else w.push('Ignored a row in '+lv.name+': '+c.join(' | ').slice(0,60))}
      else r.meta[c[0]]=c[1]||''}}
  out.forEach(r=>{r.id=slug(r.meta.id||r.title);r.version=r.meta.version||'';if(!r.levels.length)w.push(r.title+': no levels found.');r.levels.forEach(l=>{if(!l.steps.length)w.push(r.title+' / '+l.name+': no steps.')})});
  return{roads:out,warns:w}}
function coverMods(c,cv){const ms=c.secs.filter(s=>s.kind==='module'),t=cv.toLowerCase().replace(/module *([0-9]+)/g,'m$1').split(/[,; ]+/).filter(x=>x&&x!=='domain'&&x!=='domains'&&x!=='modules');
  return t.includes('all')?ms:ms.filter(s=>t.some(x=>x===s.id||x===(s.dom||'').toLowerCase()||x===(s.uid||'').toLowerCase()))}
function roadStat(r,find,done){let T=0,D=0,miss=0;
  const levels=r.levels.map(l=>({name:l.name,steps:l.steps.map(s=>{const c=find(s.course);if(!c){if(s.req)miss++;return{...s,c:null}}
    const ms=coverMods(c,s.covers),d=done(c),n=ms.filter(m=>d[m.id]).length;if(s.req){T+=ms.length;D+=n}return{...s,c,n,t:ms.length}})}));
  return{pct:T?Math.round(100*D/T):0,miss,levels,req:T}}
const catsMd=a=>['# Categories','','| Field | Value |','| --- | --- |','| pack_type | category |','| schema_version | 1 |','','| ID | Name | Parent | Description |','| --- | --- | --- | --- |',...a.map(x=>`| ${x.id} | ${x.name} | ${x.parent} | ${x.desc} |`),''].join(NL);
const roadsMd=a=>a.map(r=>['# Roadmap: '+r.title,'','| Field | Value |','| --- | --- |',...Object.entries({id:r.id,...r.meta}).map(([k,v])=>`| ${k} | ${v} |`),'',...r.levels.flatMap(l=>['## '+l.name,'','| Step | Course ID | Required | Covers | Note |','| --- | --- | --- | --- | --- |',...l.steps.map((s,i)=>`| ${i+1} | ${s.course} | ${s.req?'yes':'no'} | ${s.covers} | ${s.note} |`),''])].join(NL)).join(NL);
function parseDiag(t){
  const L=t.split(NL),i=L.findIndex(l=>/^### 0[.]6/.test(l));if(i<0)return null;
  const j=L.findIndex((l,k)=>k>i&&/^### /.test(l)),S=L.slice(i+1,j<0?L.length:j),items=[];
  S.forEach(l=>{const m=l.match(/^[*][*]([PD][0-9]+)[.][*][*] *(.*)/);if(m){const so=splitOptions(m[2],3);if(Object.keys(so.opts).length>=3)items.push({id:m[1],stem:so.stem,opts:so.opts})}});
  if(!items.length)return null;
  const kl=S.filter(l=>/(Answers:|key:)/i.test(l)).join(' '),re=/([PD][0-9]+) ([A-E])|[(](D[0-9]+)[)]/g;let m,pend=[],last=0;
  while(m=re.exec(kl)){if(m[1]){const it=items.find(x=>x.id===m[1]);if(it){it.key=[m[2]];pend.push(it)}last=re.lastIndex}else{pend.forEach(x=>x.dom=m[3]);pend=[];last=re.lastIndex}}
  const ok=items.filter(x=>x.key&&x.opts[x.key[0]]);return{items:ok,advice:kl.slice(last).replace(/^[. ]+/,'').trim(),bad:items.length-ok.length}}
function recallCards(md){
  const i=md.indexOf('### Recall check');if(i<0)return[];const o=[];for(const l of md.slice(i+16).split(NL)){if(/^(### |---)/.test(l))break;o.push(l)}
  const x=o.join(' ').trim();if(!x)return[];const p=x.split(/[(][0-9]+[)] */);if(p.length<3)return[x];
  const lead=p[0].trim(),c=p.slice(1).map(s=>s.trim().replace(/[;,.]+$/,'')),k=c[c.length-1].search(/[.] Then /);let tail='';
  if(k>0){tail=c[c.length-1].slice(k+2);c[c.length-1]=c[c.length-1].slice(0,k)}
  return c.map(s=>lead+' '+s).concat(tail?[tail]:[])}

  else if(a==='pdf'||a==='doc'){const c=C(),h='<h1>'+esc(c.title)+'</h1>'+c.secs.map(s=>'<h2>'+esc(s.title)+'</h2>'+md(s.md)).join('');
    if(a==='pdf'){let p=$('#pv');if(!p){p=document.createElement('div');p.id='pv';document.body.append(p)}p.innerHTML=h;document.body.classList.add('pr');window.print();setTimeout(()=>document.body.classList.remove('pr'),800)}
    else{const u=URL.createObjectURL(new Blob(['<html><head><meta charset=utf-8><title>'+esc(c.title)+'</title></head><body>'+h+'</body></html>'],{type:'application/msword'})),l=document.createElement('a');l.href=u;l.download=slug(c.title)+'.doc';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='sq'){V.q=e.target.value;$('#list').innerHTML=listHTML()}
  else if(e.target.id==='f'){V.f=e.target.value;V.fi=0;const c=C(),s=cur(c);if(V.f&&!cnt(s,V.f)){const t=c.secs.find(x=>unl(c,x)&&cnt(x,V.f));if(t)V.sid=t.id}refocus('#f')}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='ik'){V.ik=e.target.value;V.imp=null;render()}
  else if(e.target.id==='lk'){S.cfg.lock=e.target.checked;await save();render()}
  else if(e.target.id==='pf'){S.active=e.target.value;await save();render()}
  else if(e.target.id==='file'){const f=e.target.files[0];if(!f)return;const k=V.ik||'course',tx=await f.text();V.imp={name:f.name,kind:k,r:k==='course'?parseCourse(tx):k==='cats'?checkCats(tx):checkRoads(tx)};render()}
});
document.addEventListener('keydown',e=>{if(e.target.id==='f'&&e.key==='Enter'){e.preventDefault();jump(e.shiftKey?-1:1)}});
const tag=()=>{[['[data-id=lib][data-a=nav]','library'],['[data-id=imp][data-a=nav]','import'],['#sq','library'],['#file','import'],['[data-id=test][data-a=tab]','practice'],['[data-id=hist][data-a=tab]','progress'],['#pf','profiles'],['#np','profiles'],['[data-a=addp]','profiles'],['[data-a=done]','progress'],['#f','find']].forEach(([q,k])=>document.querySelectorAll(q).forEach(e=>e.dataset.help=k))};
const HELP={library:['Library','Courses are grouped by category. Each card shows estimated hours, difficulty, stars and progress. The search box matches titles, categories and module titles.'],
import:['Import','Choose a course .md file. The app checks it, shows warnings, and adds it only if nothing is blocked. A course with a Library Data section (Schema v1) also gives the app question IDs, module links and Bloom levels.'],
practice:['Practice test','Each test draws up to 30 random questions from the course pool, in random order, and prefers questions you have not seen yet. Pick a difficulty or Mixed.'],
difficulty:['Difficulty levels','Starter has about 15% higher-order questions (analyze, evaluate, create), Builder about 40% and Expert about 70%. A course is rated by the share of higher-order questions in its pool. This needs Bloom’s-level tags in the course; without them only Mixed is offered.'],
recap:['Recap test and the 80% rule','Every module ends with a recap test made from that module’s questions. Score 80% or more to complete the module, earn stars (80% = 1, 90% = 2, 100% = 3) and open the next module. A locked module only shows a message until then.'],
find:['Find in course','Type a word to count matches across the whole course and highlight them. Use ▲ ▼ or Enter to move between matches, across modules that are open.'],
progress:['Progress, stars and XP','Completing a module gives 10 XP, each star gives 15 XP and each practice test gives 2 XP. The path of circles shows done (★), current (number) and locked (🔒) modules.'],
export:['Save as PDF or Word','PDF opens the print dialog with the whole course; choose Save as PDF. Word saves a .doc file that Word can open. These work in the downloaded file, and may be blocked in the hosted preview.'],
profiles:['Profiles','Each profile keeps its own progress, stars and attempts on this device. Profiles are not password-protected.'],
areas:['Parts of the library','Library: your courses grouped by category, with progress, plus your career roadmaps. Course page: Read (with find), Practice test, History, and Save as PDF or Word. Import: add a course, categories or roadmaps from a file. Export: save categories, roadmaps, your progress report or a library index. Help: this page. Profile box: switch between people on this device.'],
imports:['Import: what each choice expects','Course: a .md course file from the course generator. Categories: a .md file with a table whose columns are ID, Name, Parent and Description. Roadmap: a .md file with one or more roadmaps. Each file is checked first, and nothing is added if the check is blocked. Importing again with the same ID updates the old item.'],
categories:['Categories file format',`Columns: ID (a short unique code), Name (shown in the library), Parent (the ID of a parent category, or empty for a top-level one) and Description. A course joins a category when you type its name or ID at import. Template:<pre>${esc(TPL.cats)}</pre><button data-a='tpl' data-id='cats'>Download this template</button>`],
roadmaps:['Roadmap file format',`A roadmap starts with a line like # Roadmap: Title, then a Field and Value table (id, version, region and so on), then one ## Level heading per level, each with a table. Columns: Step (1, 2, 3), Course ID (the ID shown on the course card), Required (yes or no), Covers (all, or modules such as Module 3 or m5, or exam domains such as D3) and Note. Only required steps count toward the percentage, which is the share of covered modules you have completed. A course that is not in the library shows as Missing and is not counted in the percentage. A ## Sources section is ignored. Template:<pre>${esc(TPL.road)}</pre><button data-a='tpl' data-id='road'>Download this template</button>`],
exports:['Export','Categories and roadmaps are saved in the same format you import, so they can be edited and imported again. The progress report lists, for the current profile, the modules done, stars and practice tests per course. The library index lists every course with its ID, hours, modules, questions and difficulty.'],
diagnostic:['Diagnostic','If a course has a diagnostic (usually before Module 1), answer its short questions without looking anything up. It is a starting point, not a grade. Domains with two or more misses are flagged with the modules that need extra time, and the app shows the course’s own advice. The answer key and any domain labels are read from the course file.'],
flashcards:['Recall flashcards','Each module’s Recall check is split into cards. Say the answer from memory, show the module notes to check, then rate yourself: Got it, Partly or Again. Finished modules return after 1, 3 and 7 days (the course plan), then 14 and 30 days. Again sends a module back to day 1.'],
reset:['Reset and remove a course','Reset starts the course again for the current profile: modules lock again and stars, recap results and the review schedule are cleared. Your history and achievements stay. Remove (owner profile only) deletes the course content from the device for everyone; each profile keeps its history and achievements, marked as removed, and importing the course again reconnects them.'],
visibility:['Public and private courses','A public course is visible to every profile on this device. A private course is visible only to its owner profile and to profiles that unlock it with the course ID and password. Only the owner can change the visibility or the password, and a new password locks everyone else out again. This is a visibility lock, not encryption: the stored data is not protected from someone who can open the browser storage.'],
history:['History','Shows every practice test attempt of the current profile across all courses, with the course attempt number and the difficulty level. Module recap tests, the diagnostic and flashcards are not recorded here.'],
achievements:['Achievements','A course is completed when all module recaps are passed with 80% or more and a practice test scores 80% or more, in the same attempt of the course. Completions are kept after a reset or removal.']};
function helpHTML(){return'<h2>Help</h2>'+Object.entries(HELP).map(([k,v])=>`<h3 id='h-${k}'>${v[0]}</h3><div>${v[1]}</div>`).join('')+`<h3>Learning path lock</h3><p><label><input type='checkbox' id='lk' ${S.cfg.lock?'checked':''}> Lock each module until the previous recap test is passed with 80%</label></p><p class='mut'>The lock applies to the current profile. A module’s recap test is drawn from the questions tagged with that module in the course file.</p>`}
const hb=document.createElement('button');hb.className='hb';hb.textContent='?';hb.setAttribute('aria-label','Help about this feature');hb.hidden=true;document.body.append(hb);let ht='',hd;
const showHb=e=>{const t=e.target.closest&&e.target.closest('[data-help]');if(!t)return;clearTimeout(hd);ht=t.dataset.help;const r=t.getBoundingClientRect();hb.style.left=Math.min(r.right-6,innerWidth-26)+'px';hb.style.top=Math.max(r.top-12,2)+'px';hb.hidden=false};
document.addEventListener('mouseover',showHb);document.addEventListener('focusin',showHb);
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('[data-help]'))hd=setTimeout(()=>{hb.hidden=true},900)});
hb.addEventListener('mouseenter',()=>clearTimeout(hd));
hb.addEventListener('click',()=>{V.n='help';V.hp=ht;hb.hidden=true;render()});
addEventListener('scroll',()=>{hb.hidden=true},true);
(async()=>{const s=await db.get();if(s)S=s;S.cfg??={lock:true};S.cats??=[];S.roads??=[];S.gone??={};S.unl??={};S.courses.forEach(c=>{c.owner??=S.profiles[0].id;c.vis??='public'});

  // T1.2 migration: mark earlier modules done if later module has progress
  if(!S.migratedEmptyPool){
    for(const cid of Object.keys(S.prog[S.active]??{})){
      const cp=CP(cid),c=C();if(!c)continue;
      const ms=mods(c);
      for(let i=1;i<ms.length;i++){
        const cur=ms[i],prev=ms[i-1];
        const curDone=cp.done[cur.id],curRec=cp.rec[cur.id];
        if((curDone||(curRec&&curRec.best))&&!cp.done[prev.id]){
          cp.done[prev.id]=1;cp.dt[prev.id]??=Date.now();
        }
      }
    }
    S.migratedEmptyPool=true;await save();
  }

  render();if(!await db.h())$('#st').textContent='Saving is unavailable here, so progress lasts only until you close this page.'})();
</script>
