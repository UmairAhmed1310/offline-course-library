// T1.17: an unexpected error shows a small banner instead of failing silently.
// Kept outside CORE, free of app state, and built with textContent so it still works if the app itself is broken.
const errText=x=>String((x&&x.message)||x||'unknown error').replace(/\s+/g,' ').slice(0,200);
let errN=0;
function showErr(x){
  try{

    if(!b){
      b=document.createElement('div');b.id='err';b.setAttribute('role','alert');
      b.innerHTML="<p><b class='bd'>Something went wrong.</b> You can keep working, or reload the page.</p><p class='mut' id='errd'></p><div class='row'><button class='pri' data-a='reload'>Reload</button><button data-a='errx'>Dismiss</button></div>";
      document.body.append(b)}

  catch(_){}}
addEventListener('error',e=>showErr(e.error||e.message));
addEventListener('unhandledrejection',e=>showErr(e.reason));
/*CORE*/
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);

const findCourse=(cs,id,ok)=>{const f=ok||(()=>true);return cs.find(c=>c&&c.id===id&&f(c))||cs.find(c=>c&&c.alias&&c.alias===id&&f(c))};
const inl=s=>esc(s).replace(/\\([\[\]])/g,'$1').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>');

    if(/^\s*\|/.test(l)){const r=[];while(i<L.length&&/^\s*\|/.test(L[i]))r.push(L[i++]);

function splitOptions(b,mn=4){

  const m=[...b.matchAll(/(?:^|\s)([A-E])\.\s/g)].map(x=>({p:x.index+x[0].indexOf(x[1]),l:x[1]})).slice(-100);

const DIFF=[{n:'Starter',i:'🌱',hi:.15},{n:'Builder',i:'🧭',hi:.4},{n:'Expert',i:'🏆',hi:.7}];

// T1.21: names and states for assistive technology that the templates do not carry: progress bars, path pills,
// the current page, tab and section, locked modules, the section navigation's name.
// It runs from a MutationObserver, so every way of changing the page is covered: render() and also the partial
// updates that replace only part of the page (find-in-course swaps the section navigation in place).
// It only sets attributes, and the observer only watches added and removed nodes, so it cannot loop.
function semantics(){
  document.querySelectorAll('#app .bar').forEach(b=>{
    const i=b.firstElementChild,w=Math.max(0,Math.min(100,Math.round(parseFloat(i&&i.style.width)||0))),
      scope=b.closest('details,.card,.hero')||b.parentElement,
      said=[...scope.querySelectorAll('summary,.mut')].find(x=>/\d+%/.test(x.textContent));
    b.setAttribute('role','progressbar');b.setAttribute('aria-label',b.closest('details')?'Roadmap progress':'Course progress');
    b.setAttribute('aria-valuemin','0');b.setAttribute('aria-valuemax','100');b.setAttribute('aria-valuenow',w);
    if(said){const t=said.textContent.replace(/\s+/g,' ').trim().split(' · '),k=t.findIndex(x=>/\d+%/.test(x));
      b.setAttribute('aria-valuetext',t.slice(0,k+1).join(' · '))}});
  document.querySelectorAll('#bar button.on').forEach(x=>x.setAttribute('aria-current','page'));
  document.querySelectorAll('#app button[data-a=tab].on').forEach(x=>x.setAttribute('aria-current','true'));
  const c=V.n==='course'&&C(),sn=document.querySelector('#app .split>nav');
  if(sn){sn.setAttribute('aria-label','Course sections');
    sn.querySelectorAll('.nav').forEach(x=>{const s=c&&c.secs.find(t=>t.id===x.dataset.id);
      if(x.classList.contains('on'))x.setAttribute('aria-current',s&&s.kind==='module'?'step':'page');else x.removeAttribute('aria-current');
      if(x.classList.contains('lk'))x.setAttribute('aria-disabled','true');else x.removeAttribute('aria-disabled')})}
  if(c){const cp=CP(c.id),ms=mods(c);document.querySelectorAll('#app .pill').forEach((p,i)=>{const s=ms[i];if(!s)return;
    const n=Math.max(1,stars((cp.rec[s.id]||{}).best||0));
    p.setAttribute('role','img');p.setAttribute('aria-label',s.title+': '+(cp.done[s.id]?'done, '+n+' star'+(n===1?'':'s'):unl(c,s)?'open':'locked'))})}
}
{const mo=new MutationObserver(()=>{try{semantics()}catch(_){}});['#app','#bar'].forEach(q=>{const e=document.querySelector(q);if(e)mo.observe(e,{childList:true,subtree:true})})}

const HELP={library:['Library','Courses are grouped by category. Each card shows estimated hours, difficulty, stars and progress. The search box matches titles, categories and module titles.'],
import:['Import','Choose a course .md file. The app checks it, shows warnings, and adds it only if nothing is blocked. A course with a Library Data section (Schema v1) also gives the app question IDs, module links and Bloom levels.'],
practice:['Practice test','Each test draws up to 30 random questions from the course pool, in random order, and prefers questions you have not seen yet. Pick a difficulty or Mixed.'],
difficulty:['Difficulty levels','Starter has about 15% higher-order questions (analyze, evaluate, create), Builder about 40% and Expert about 70%. A course is rated by the share of higher-order questions in its pool. This needs Bloom’s-level tags in the course; without them only Mixed is offered.'],
recap:['Recap test and the 80% rule','Every module ends with a recap test made from that module’s questions. Score 80% or more to complete the module, earn stars (80% = 1, 90% = 2, 100% = 3) and open the next module. A locked module only shows a message until then.'],
find:['Find in course','Type a word to count matches across the whole course and highlight them. Use ▲ ▼ or Enter to move between matches, across modules that are open.'],
progress:['Progress, stars and XP','Completing a module gives 10 XP, each star gives 15 XP and each practice test gives 2 XP. The path of circles shows done (★), current (number) and locked (🔒) modules.'],
export:['Save as PDF or Word','PDF opens the print dialog with the whole course; choose Save as PDF. Word saves a .doc file that Word can open. These work in the downloaded file, and may be blocked in the hosted preview.'],
profiles:['Profiles','Each profile keeps its own progress, stars and attempts on this device. Profiles are not password-protected: anyone using this browser can switch to any profile.'],
areas:['Parts of the library','Library: your courses grouped by category, with progress, plus your career roadmaps. Course page: Read (with find), Practice test, History, and Save as PDF or Word. Import: add a course, categories or roadmaps from a file. Export: save categories, roadmaps, your progress report or a library index. Help: this page. Profile box: switch between people on this device.'],
imports:['Import: what each choice expects','Course: a .md course file from the course generator. Categories: a .md file with a table whose columns are ID, Name, Parent and Description. Roadmap: a .md file with one or more roadmaps. Each file is checked first, and nothing is added if the check is blocked. Importing again with the same ID updates the old item.'],
categories:['Categories file format',`Columns: ID (a short unique code), Name (shown in the library), Parent (the ID of a parent category, or empty for a top-level one) and Description. A course joins a category when you type its name or ID at import. Template:<pre>${esc(TPL.cats)}</pre><button data-a='tpl' data-id='cats'>Download this template</button>`],
roadmaps:['Roadmap file format',`A roadmap starts with a line like # Roadmap: Title, then a Field and Value table (id, version, region and so on), then one ## Level heading per level, each with a table. Columns: Step (1, 2, 3), Course ID (the ID shown on the course card), Required (yes or no), Covers (all, or modules such as Module 3 or m5, or exam domains such as D3) and Note. Only required steps count toward the percentage, which is the share of covered modules you have completed. A required course that is not in the library shows as Missing and counts as one module not yet done, so the percentage stays below 100% and the roadmap is marked Incomplete until you import it. Optional courses are not part of the percentage. Each roadmap also shows how many of its courses are in your library, for example 2 of 5. A ## Sources section is ignored. Template:<pre>${esc(TPL.road)}</pre><button data-a='tpl' data-id='road'>Download this template</button>`],
exports:['Export','Categories and roadmaps are saved in the same format you import, so they can be edited and imported again. The progress report lists, for the current profile, the modules done, stars and practice tests per course. The library index lists every course with its ID, hours, modules, questions and difficulty.'],
diagnostic:['Diagnostic','If a course has a diagnostic (usually before Module 1), answer its short questions without looking anything up. It is a starting point, not a grade. Domains with two or more misses are flagged with the modules that need extra time, and the app shows the course’s own advice. The answer key and any domain labels are read from the course file.'],
flashcards:['Recall flashcards','Each module’s Recall check is split into cards. Say the answer from memory, show the module notes to check, then rate yourself: Got it, Partly or Again. Finished modules return after 1, 3 and 7 days (the course plan), then 14 and 30 days. Again sends a module back to day 1.'],
reset:['Reset and remove a course','Reset starts the course again for the current profile: modules lock again and stars, recap results and the review schedule are cleared. Your history and achievements stay. Remove (owner profile only) deletes the course content from the device for everyone; each profile keeps its history and achievements, marked as removed, and importing the course again reconnects them.'],
visibility:['Visible to all, or hidden from other profiles','A course that is visible to all can be seen by every profile on this device. A hidden course is visible only to its owner profile and to profiles that unlock it with the course ID and password. Unlocking only finds courses already stored on this device: an ID and a password cannot send a course to another device or person. To share a course, give them the course file and ask them to import it on their own device. Only the owner can change the visibility or the password, and a new password locks everyone else out again. This is a visibility lock, not encryption: the stored data is not protected from someone who can open the browser storage.'],
privacy:['Privacy: what is stored and how to delete it','<p>This app has no server and no accounts. Your courses and progress are saved in this browser, on this device, and are not sent anywhere.</p><h4>What is stored</h4><ul><li>The courses you import, as parsed text.</li><li>For each profile: finished modules, recap and practice scores, stars, flashcard review dates, diagnostic results and completed-course records.</li><li>Profile names, categories, roadmaps and the module-lock setting.</li><li>For a hidden course: a random salt and a scrambled (hashed) form of its password, not the password itself, plus the list of hidden courses each profile has unlocked.</li></ul><h4>Who can read it</h4><p>Anyone who can use this browser, or open its developer tools, can read all of it, including hidden courses. Nothing is encrypted and profiles have no passwords. The password check uses a simple hash, not strong cryptography. A progress backup file is plain text too, so keep it somewhere safe. If the browser blocks storage (for example in a private window), progress is kept only until you close the page.</p><h4>How to delete it</h4><ul><li>Reset course (on the course page) clears the progress of the current profile for that course. History and achievements stay.</li><li>Remove course (owner profile only) deletes the course from this device for every profile. Each profile keeps its history for it, marked as removed.</li><li>To erase everything, clear the data for this site in your browser settings. There is no single erase-everything button in this version.</li></ul>'],
history:['History','Shows every practice test attempt of the current profile across all courses, with the course attempt number and the difficulty level. Module recap tests, the diagnostic and flashcards are not recorded here.'],
achievements:['Achievements','A course is completed when all module recaps are passed with 80% or more and a practice test scores 80% or more, in the same attempt of the course. Completions are kept after a reset or removal.']};

  // T1.2b migration (replaces the T1.2 block, which never changed anything): for EVERY profile, a module without scored questions is marked done when a later module has progress. New flag name, because S.migratedEmptyPool is already true on devices that loaded the PR #5 build. S.migEmptyPool2.marked lists every mark added, so it can be undone by hand.
  if(!S.migEmptyPool2){try{const now=Date.now(),marked=migrateEmptyPoolDone(S.prog,S.courses,pool,now);S.migEmptyPool2={t:now,marked};await save()}catch(e){console.error('T1.2b migration skipped:',e)}}

  render();if(!await db.h())$('#st').textContent='Saving is unavailable here, so progress lasts only until you close this page.'})();
</script>
<script>
/* Offline shell: cache the page so a hosted copy still opens without a network. */
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}
</script>
